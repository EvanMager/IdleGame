<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern Base Commander</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0e14'/%3E%3Crect x='15' y='15' width='30' height='30' fill='%2333d1a8'/%3E%3Crect x='55' y='15' width='30' height='30' fill='%23e8a13d'/%3E%3Crect x='15' y='55' width='70' height='30' fill='%234c9be8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">MODERN&nbsp;BASE&nbsp;COMMANDER</div>
  <div class="topbar-spacer"></div>
  <div class="cash-display" id="cashDisplayWrap">
    <span class="cash-label">CASH</span>
    <span class="cash-value" id="cashValue">$0</span>
  </div>
  <button id="dutyShiftBtn" class="topbar-btn duty-btn">🎖 Duty Shift</button>
  <button id="helpBtn" class="topbar-btn" title="Replay tutorial">? Help</button>
  <button id="resetBtn" class="topbar-btn reset-btn" title="Wipe save and restart">Reset</button>
</header>

<div id="resourceBar"></div>

<main id="mainArea">
  <aside id="buildPanel">
    <h2>Construction</h2>
    <div id="buildingList"></div>

    <h2>Territory</h2>
    <button id="expandModeBtn" class="mode-btn">Expand Land</button>
    <div id="expandInfo" class="panel-note"></div>
  </aside>

  <div id="gridWrap">
    <div id="grid"></div>
  </div>

  <aside id="infoPanel">
    <h2>Details</h2>
    <div id="selectedInfo">Select a tile or building on the grid to inspect it.</div>
  </aside>
</main>

<div id="toast" class="toast hidden"></div>

<!-- Duty Shift overlay -->
<div id="dutyShiftOverlay" class="overlay hidden">
  <div class="overlay-panel duty-panel">
    <button class="overlay-close" id="dutyCloseBtn">&times;</button>
    <div id="dutyContent"></div>
  </div>
</div>

<!-- Welcome back / offline progress modal -->
<div id="welcomeBackOverlay" class="overlay hidden">
  <div class="overlay-panel small-panel">
    <h2>Welcome back, Commander</h2>
    <div id="welcomeBackText"></div>
    <button id="welcomeBackCloseBtn" class="primary-btn">Resume Command</button>
  </div>
</div>

<!-- Tutorial overlay -->
<div id="tutorialOverlay" class="overlay hidden">
  <div id="tutorialBox">
    <div id="tutorialText"></div>
    <div class="tutorial-actions">
      <button id="tutorialSkipBtn" class="ghost-btn">Skip Tutorial</button>
      <button id="tutorialNextBtn" class="primary-btn">Next</button>
    </div>
  </div>
</div>

<script src="spanish-data.js"></script>
<script src="game.js"></script>
<script src="spanish.js"></script>
</body>
</html>
